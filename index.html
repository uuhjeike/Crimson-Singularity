<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crimson Singularity</title>
<meta name="description" content="Crimson Singularity. One existence. One identity.">
<meta name="theme-color" content="#030303">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <header class="hero">
    <img id="avatar" class="avatar" src="https://raw.githubusercontent.com/uuhjeike/Crimson-Singularity/main/IMG_20261010_184609.jpg" width="124" height="124" decoding="async" alt="Crimson Singularity: a crimson beam above a dark ringed planet">
    <h1>CRIMSON SINGULARITY</h1>
    <p id="bio" class="bio"></p>
    <ul id="socials" class="socials"></ul>
  </header>
  <div class="divider" role="separator" aria-hidden="true">
    <span class="dline l"></span>
    <svg width="150" height="72" viewBox="0 0 150 72" focusable="false">
      <defs>
        <linearGradient id="bt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF202A" stop-opacity="0"/><stop offset="1" stop-color="#FF202A"/></linearGradient>
        <linearGradient id="bb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF202A"/><stop offset="1" stop-color="#FF202A" stop-opacity="0"/></linearGradient>
        <filter id="gl" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.2"/></filter>
      </defs>
      <rect x="74.2" y="0" width="1.6" height="22" fill="url(#bt)"/>
      <g transform="rotate(-8 75 36)" fill="none">
        <path d="M8 36A67 9 0 0 1 142 36" stroke="#C7C9CE" stroke-width="1.6" opacity=".5"/>
        <path d="M24 36A51 6.5 0 0 1 126 36" stroke="#85858B" stroke-width="1" opacity=".6"/>
      </g>
      <circle cx="75" cy="36" r="15" fill="#030303" stroke="#292929"/>
      <path d="M62 28.5A15 15 0 0 1 88 28.5" fill="none" stroke="#FF202A" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="74.2" y="51" width="1.6" height="21" fill="url(#bb)" opacity=".7"/>
      <g transform="rotate(-8 75 36)" fill="none">
        <path d="M24 36A51 6.5 0 0 0 126 36" stroke="#8B000B" stroke-width="1.6"/>
        <path d="M8 36A67 9 0 0 0 142 36" stroke="#F4F4F4" stroke-width="2.2"/>
      </g>
      <circle cx="75" cy="21" r="4.5" fill="#FF202A" filter="url(#gl)"/>
      <circle cx="75" cy="21" r="1.7" fill="#F4F4F4"/>
    </svg>
    <span class="dline r"></span>
  </div>
  <p class="dtext">THE ARCHIVE</p>
  <section aria-labelledby="numlbl">
    <div class="meter" role="status"><span id="num">&mdash;</span><span id="numlbl">POSTS LOADING</span></div>
    <div id="posts"></div>
    <div id="end" aria-hidden="true"></div>
  </section>
</main>
<dialog id="lb" aria-label="Image viewer">
  <button id="lbc" type="button" aria-label="Close image viewer">Close</button>
  <img id="lbi" alt="">
</dialog>
</body>
</html>
